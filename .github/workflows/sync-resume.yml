# Synchronize the public portfolio PDF from the user's canonical Drive file.
# The website always links to our own URL, never directly to Google Drive.
name: Synchronize public résumé from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-resume.yml'
      - 'scripts/sync_resume_from_drive.py'

permissions:
  contents: write
  pages: write

# Serialize with the normal Astro publish job; they both write to master/root.
concurrency:
  group: portfolio-branch-publishing
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install PDF synchronization dependencies
        run: python3 -m pip install --quiet --break-system-packages gdown==5.2.0 pymupdf==1.26.6

      - name: Fetch latest Drive version and prepare public-safe résumé
        env:
          RESUME_DRIVE_URL: https://drive.google.com/file/d/1eQ1Kpk4iCxpiRDX51FEXSFa7egDshbyl/view?usp=sharing
        run: |
          set -euo pipefail
          python3 scripts/sync_resume_from_drive.py --source-url "$RESUME_DRIVE_URL"
          test -s public/Priyansh_Sharma_Resume.pdf
          test -s Priyansh_Sharma_Resume.pdf
          cmp public/Priyansh_Sharma_Resume.pdf Priyansh_Sharma_Resume.pdf

      - name: Publish changed PDF to the stable public URL
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            public/Priyansh_Sharma_Resume.pdf \
            Priyansh_Sharma_Resume.pdf \
            .github/resume-source.sha256

          if git diff --cached --quiet; then
            echo "No Drive changes detected; existing PDF is current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sync latest sanitized résumé from Google Drive'
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild for updated PDF
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
