# Build Astro and publish compiled files into the already-configured
# GitHub Pages source: master / (root). No Pages settings migration needed.
name: Publish Astro portfolio

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/sync_resume_from_drive.py'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-branch-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out master with scoped push permission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Install résumé synchronization dependencies
        run: python3 -m pip install --quiet --break-system-packages gdown==5.2.0 pymupdf==1.26.6

      - name: Refresh public résumé from canonical Google Drive
        env:
          RESUME_DRIVE_URL: https://drive.google.com/file/d/1eQ1Kpk4iCxpiRDX51FEXSFa7egDshbyl/view?usp=sharing
        shell: bash
        run: |
          set -euo pipefail
          # On source-code pushes, retain the last safe PDF if Drive is temporarily unavailable.
          # Scheduled/manual checks fail visibly, so a broken Drive link cannot go unnoticed.
          if ! python3 scripts/sync_resume_from_drive.py --source-url "$RESUME_DRIVE_URL"; then
            if [ "${{ github.event_name }}" != 'push' ]; then
              echo "::error::Drive résumé sync failed; keeping last published copy"
              exit 1
            fi
            echo "::warning::Drive résumé unavailable; proceeding with previous safe PDF"
          fi

      - name: Check and build Astro
        run: npm run build

      - name: Verify generated pages and legacy redirects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          root = Path('dist')
          required = (
              'index.html',
              'work/distributed-billing/index.html',
              'work/order-scheduler/index.html',
              'projects/index.html',
              'achievements/index.html',
          )
          redirects = {
              'about_me.html': '/#about',
              'projects.html': '/projects/',
              'work_experience.html': '/#work',
              'coding_profile.html': 'https://github.com/Priyansh-15',
              'achievements_and_certifications.html': '/achievements/',
          }
          for name in (*required, *redirects):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, (
                  f'Missing or empty output: {name}'
              )
          for name, target in redirects.items():
              html = (root / name).read_text(encoding='utf-8')
              assert target in html or escape(target, quote=True) in html, (
                  f'Wrong redirect destination: {name}'
              )
          assert any((root / '_astro').glob('*.css')), 'Missing Astro CSS'
          resume = root / 'Priyansh_Sharma_Resume.pdf'
          assert resume.is_file() and resume.stat().st_size > 2000, (
              'Missing or empty résumé PDF in generated site'
          )
          assert resume.read_bytes().startswith(b'%PDF-'), 'Invalid résumé PDF signature'
          project_page = (root / 'projects/index.html').read_text(encoding='utf-8')
          assert all(fragment in project_page for fragment in
                     ('id="professional"', 'id="independent"', 'id="earlier"')), (
              'Missing Project index sections'
          )
          achievements_page = (root / 'achievements/index.html').read_text(
              encoding='utf-8'
          )
          assert all(fragment in achievements_page for fragment in
                     ('id="highlights"', 'id="record"', 'id="credentials"')), (
              'Missing achievements collection sections'
          )
          print('Verified 5 routes, 5 redirects, stylesheets and résumé PDF')
          PY

      - name: Stage static build in Pages branch root
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -f index.html
          # These are generated output paths, not the Astro source directories.
          rm -rf -- _astro work projects achievements
          cp -a dist/. .
          git add -A -- \
            index.html \
            work \
            projects \
            achievements \
            _astro \
            favicon.svg \
            about_me.html \
            projects.html \
            work_experience.html \
            coding_profile.html \
            achievements_and_certifications.html \
            Priyansh_Sharma_Resume.pdf \
            public/Priyansh_Sharma_Resume.pdf

          if test -f .github/resume-source.sha256; then
            git add -A -- .github/resume-source.sha256
          fi

          if git diff --cached --quiet; then
            echo "No generated site changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish compiled Astro portfolio'
          git push origin HEAD:master

      - name: Request branch-based Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A commit written with GITHUB_TOKEN does not itself trigger Pages.
          # Explicitly request the branch build after publishing all files.
          curl --fail-with-body --location --retry 3 --retry-all-errors             --request POST             --header 'Accept: application/vnd.github+json'             --header "Authorization: Bearer $GH_TOKEN"             --header 'X-GitHub-Api-Version: 2022-11-28'             --data '{}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
