name: CI

on:
  push:
    branches: [portfolio-v3]
  pull_request:
    branches: [portfolio-v3, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Check source formatting
        run: |
          for file in src/pages/index.astro src/styles/section-experience.css; do
            echo "__FORMAT_START__ $file"
            ./node_modules/.bin/prettier "$file"
            echo "__FORMAT_END__ $file"
          done
          npm run format:check

      - name: Check Astro diagnostics and build static site
        run: npm run build

      - name: Verify generated pages and legacy redirects
        run: |
          set -euo pipefail
          for file in \
            index.html \
            work/distributed-billing/index.html \
            work/order-scheduler/index.html \
            projects/index.html \
            achievements/index.html \
            coding-profiles/index.html \
            about_me.html \
            projects.html \
            work_experience.html \
            coding_profile.html \
            achievements_and_certifications.html
          do
            test -s "dist/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          redirects = {
              'about_me.html': '/#about',
              'projects.html': '/projects/',
              'work_experience.html': '/#work',
              'coding_profile.html': '/coding-profiles/',
              'achievements_and_certifications.html': '/achievements/',
          }
          for name, target in redirects.items():
              generated = (Path('dist') / name).read_text(encoding='utf-8')
              assert target in generated or escape(target, quote=True) in generated, (
                  f'Unexpected destination for {name}: expected {target}'
              )
          html = (Path('dist') / 'projects/index.html').read_text(encoding='utf-8')
          for required in ('id="professional"', 'id="independent"', 'id="earlier"',
                           'Job Find Helper', 'Steganography', 'Mancala'):
              assert required in html, 'Missing Projects content: ' + required
          achievements = (Path('dist') / 'achievements/index.html').read_text(
              encoding='utf-8'
          )
          for item in ('id="highlights"', 'id="record"', 'id="credentials"',
                       'Google Kick Start', 'Meta Hacker Cup',
                       'Amazon Security Certificate', 'CodeKaze', 'GATE'):
              assert item in achievements, 'Missing achievements entry: ' + item
          profiles = (Path('dist') / 'coding-profiles/index.html').read_text(
              encoding='utf-8'
          )
          for handle in ('Priyansh_15', 'Priyansh.15', 'spidey15priyansh',
                         'priyansh-sharma_596', 'spidy_ps15', '15priyansh13_201',
                         '15priyansh13.2001', 'Priyansh15'):
              assert handle in profiles, 'Missing coding profile: ' + handle
          assert profiles.count('class="coding-profile-row"') == 8
          home = (Path('dist') / 'index.html').read_text(encoding='utf-8')
          from html.parser import HTMLParser
          class StageCounter(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.count = 0
              def handle_starttag(self, tag, attrs):
                  if any(k == 'data-scroll-stage' for k, _ in attrs):
                      self.count += 1
          parser = StageCounter()
          parser.feed(home)
          assert parser.count == 9, f'Expected 9 reading stages, got {parser.count}'
          assert home.count('stage-cue--previous') >= 6, 'Previous cues missing'
          assert home.count('stage-cue--next') >= 6, 'Next cues missing'
          assert 'stage-cue--hero' in home, 'Hero cue needs centered presentation'
          for marker in ('id="fleet-interactions"', 'id="ai-code-intelligence"',
                         'class="work-opening"', 'story-list--continuation'):
              assert marker in home, f'Missing featured project frame: {marker}'
          for target in ('#top', '#work', '#experience', '#explore', '#about', '#thinking', '#contact'):
              assert f'href="{target}"' in home, f'Missing section navigation: {target}'
          for content in ('Designing the core engine for distributed billing',
                          'Redesigning the framework for Fleet interactions',
                          'Helping AI keep up with a real codebase'):
              assert content in home, 'Lost approved engineering content: ' + content
          for href in ('/projects/', '/achievements/', '/coding-profiles/'):
              assert f'href="{href}"' in home, f'Missing discovery link: {href}'
          assert 'id="explore"' in home, 'Missing homepage discovery section'
          print('Verified 9 stages, 12 navigation cues, and three discovery routes.')
          print('Verified 6 primary pages, 5 redirects, projects, achievements, and 8 coding profiles.')
          PY
