# Temporary Prettier export, removed after clean validation.
name: Coding profiles formatting export (temporary)
on:
  push:
    branches: [feature/coding-profiles-directory]
    paths: ['.github/workflows/format-coding-profiles.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Export formatted source
        run: |
          npm ci
          npx prettier --write src/pages/coding-profiles/index.astro src/pages/index.astro src/styles/coding-profiles.css
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('src/pages/coding-profiles/index.astro', 'src/pages/index.astro', 'src/styles/coding-profiles.css'):
              p = Path(name)
              print('FORMATTED_CODING_JSON '+json.dumps({'path':name,'content':p.read_text()},ensure_ascii=False))
          PY
